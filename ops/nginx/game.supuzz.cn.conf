# 田野之间落地页：game.supuzz.cn / game.supuzz.com
#
# 与拆分前相比只有一处变化：/ 不再反代到后端 /game/，改为直接读静态目录
# （配置在 littlefield.inc 里）。/play/、/downloads/、/api/ 仍然转发到
# feedback-server。整体替换 /etc/nginx/conf.d/game.supuzz.cn.conf，
# littlefield.inc 放到 /etc/nginx/snippets/。
#
# game.supuzz.cn 与 game.supuzz.com 指同一套内容，但证书不同：Nginx 1.24 在同一
# server 块里对同类型（同为 EC）的多张证书不做 SNI 选择，会统一用最后一张，
# 所以必须一个域名一个 443 server 块，location 规则放 littlefield.inc 共用。

limit_req_zone $binary_remote_addr zone=littlefield_analytics:10m rate=3r/s;

server {
    listen 80;
    server_name game.supuzz.cn game.supuzz.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    # 按请求域名跳 HTTPS，两个域名各自留在自己的域上。
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name game.supuzz.cn;
    # Reuse the server's existing wildcard certificate for *.supuzz.cn.
    ssl_certificate /etc/nginx/ssl/supuzz.cn/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/supuzz.cn/private.key;
    access_log /var/log/nginx/littlefield.access.log;
    error_log /var/log/nginx/littlefield.error.log;
    include /etc/nginx/snippets/littlefield.inc;
}

server {
    listen 443 ssl http2;
    server_name game.supuzz.com;
    # Separate certificate for game.supuzz.com; the *.supuzz.cn wildcard
    # does not cover .com. Issued via DNS-01 because port 80 is blocked by
    # the ICP filter until supuzz.com is filed:
    #   acme.sh --issue --dns dns_ali -d game.supuzz.com --keylength ec-256
    ssl_certificate /etc/nginx/ssl/supuzz.com/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/supuzz.com/private.key;
    access_log /var/log/nginx/littlefield.access.log;
    error_log /var/log/nginx/littlefield.error.log;
    include /etc/nginx/snippets/littlefield.inc;
}
